; ORCA-BOARD Control Rev A — firmware micro-ROS de uso general (rclc, ROS 2 Jazzy). Ver README.md.
; Misma plataforma que orca_motor_bench / orca_gesture_imu (espressif32 6.5.0, Arduino core 2.0.14).
; Cada entorno construye su propia librería micro-ROS desde fuente la primera vez (~2 min, requiere red).
; Compilar SIN ROS sourceado en la terminal (ver README): env -i HOME=$HOME PATH=... pio run
[platformio]
default_envs = orca_usb

[env]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = default.csv
board_build.flash_mode = qio
board_microros_distro = jazzy
board_microros_user_meta = colcon.meta
lib_deps =
  adafruit/Adafruit BNO08x@1.2.5
  https://github.com/micro-ROS/micro_ros_platformio#cfee17faffaa532363b7151dd13af6a85c69d3c1
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DORCA_ROS_DOMAIN_ID=0          ; debe coincidir con ROS_DOMAIN_ID de los nodos del PC
  '-DORCA_NAMESPACE=""'           ; p. ej. "robot1" para varias placas en la misma red
upload_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_80:45:6B:52:F6:2C-if00
monitor_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_80:45:6B:52:F6:2C-if00
monitor_speed = 115200

; Agente por el cable USB (USB-Serial/JTAG del ESP32-S3). Probado.
[env:orca_usb]
board_microros_transport = serial

; Agente por Wi-Fi (UDP). Credenciales e IP del agente desde variables de entorno al compilar:
;   ORCA_WIFI_SSID=... ORCA_WIFI_PASS=... ORCA_AGENT_IP=192.168.x.y pio run -e orca_wifi -t upload
; Quedan grabadas en el binario. El USB queda libre: imprime IP y agente al arrancar (115200).
[env:orca_wifi]
board_microros_transport = wifi
build_flags =
  ${env.build_flags}
  -DORCA_TRANSPORT_WIFI
  '-DORCA_WIFI_SSID="${sysenv.ORCA_WIFI_SSID}"'
  '-DORCA_WIFI_PASS="${sysenv.ORCA_WIFI_PASS}"'
  '-DORCA_AGENT_IP="${sysenv.ORCA_AGENT_IP}"'
  -DORCA_AGENT_PORT=8888
