; ORCA-BOARD Control Rev A — BNO085 (U1) como fuente IMU para el GUI de arm_gesture.
; Mismo protocolo USB/BLE que arm_gesture/firmware (MPU6050, "GestureIMU"), nombre BLE "ORCA".
; Misma plataforma que esa referencia (Arduino core 2.0.14, Bluedroid) para no cambiar el BLE.
[env:orca_control]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = huge_app.csv      ; BLE (Bluedroid) necesita > 1.3 MB de app
board_build.flash_mode = qio
lib_deps =
  adafruit/Adafruit BNO08x@1.2.5
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
upload_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_80:45:6B:52:F6:2C-if00
monitor_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_80:45:6B:52:F6:2C-if00
monitor_speed = 115200
