; ORCA-BOARD Control Rev A — banco de prueba de motores (U5/U6 DRV8874).
; Misma plataforma que orca_gesture_imu (Arduino core 2.0.14). El PWM usa la API ledc de ESP-IDF,
; que no cambia entre versiones del core.
[env:orca_control]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = default.csv
board_build.flash_mode = qio
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
upload_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_80:45:6B:52:F6:2C-if00
monitor_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_80:45:6B:52:F6:2C-if00
monitor_speed = 115200
monitor_filters = send_on_enter
monitor_echo = yes
