; ORCA-BOARD Control Rev A — PlatformIO para ESP32-S3-WROOM-1-N4 (4 MB flash, sin PSRAM)
; Compila el mismo sketch que usa Arduino IDE (../bringup_hello).

[platformio]
src_dir = ../bringup_hello

[env:orca_control]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; La DevKitC-1 trae 8 MB por defecto; el módulo de la placa es N4
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = default.csv
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_qspi

; Serial por el USB nativo (USB-Serial/JTAG)
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
monitor_speed = 115200
